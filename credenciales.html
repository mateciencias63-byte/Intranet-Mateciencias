<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credenciales Válidas - MateCiencias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html *, html *::before, html *::after {
            font-family: 'Space Grotesk', Arial, sans-serif !important;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .header h1 {
            color: #1e7a42;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .header p {
            color: #666;
            font-size: 1.1rem;
        }

        .credentials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .card-number {
            display: inline-block;
            background: #1e7a42;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .card-title {
            color: #1e7a42;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .credentials-row {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }

        .credentials-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .label {
            font-size: 0.85rem;
            color: #999;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .value {
            font-size: 1rem;
            color: #333;
            font-family: 'Courier New', monospace;
            background: #f5f5f5;
            padding: 8px 12px;
            border-radius: 6px;
            word-break: break-all;
            user-select: all;
        }

        .info-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 30px;
        }

        .info-box strong {
            color: #856404;
        }

        .info-box p {
            color: #856404;
            margin: 5px 0;
        }

        .back-link {
            display: inline-block;
            background: white;
            color: #1e7a42;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            margin-bottom: 20px;
            transition: background 0.2s ease;
        }

        .back-link:hover {
            background: #f0f0f0;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .credentials-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Volver al Login</a>

        <div class="header">
            <h1>📋 Credenciales Válidas</h1>
            <p>MateCiencias - Sistema de Acceso</p>
        </div>

        <div class="info-box">
            <strong>⚠️ Importante:</strong>
            <p>Las credenciales que aparecen aquí son válidas para acceder al sistema MateCiencias.</p>
            <p>Ingresa el <strong>Nombre Completo</strong> exactamente como aparece aquí y la <strong>Contraseña de 10 dígitos</strong>.</p>
        </div>

        <div class="credentials-grid" id="credentialsContainer">
            <!-- Se llenará con JavaScript desde usuario.js -->
        </div>
    </div>

    <script src="usuario.js?v=20260905-4"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const accounts = UsuarioService.getApprovedAccounts();
            const container = document.getElementById('credentialsContainer');

            container.innerHTML = accounts.map((account, index) => `
                <div class="card">
                    <div class="card-number">${index + 1}</div>
                    <div class="card-title">${account.name}</div>
                    <div class="credentials-row">
                        <div class="label">Nombre de Usuario</div>
                        <div class="value">${account.name}</div>
                    </div>
                    <div class="credentials-row">
                        <div class="label">Contraseña</div>
                        <div class="value">${account.password}</div>
                    </div>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
