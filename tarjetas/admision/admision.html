<!DOCTYPE html>
<html lang="es">
  <head>
    <base href="../../" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MateCiencias | Admisión</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="logo.png" />
    <style>
      .admision-page { min-height:100vh; padding:32px clamp(18px,4vw,58px) 48px; }
      .admision-card { width:100%; padding:24px; border:1px solid #e1e8f0; border-radius:10px; background:#fff; box-shadow:0 12px 28px rgba(15,41,80,.08); }
      .admision-card h1 { margin:0; color:#12233f; font-size:clamp(1.7rem,3vw,2.35rem); }
      .admision-card > p { margin:8px 0 22px; color:#65748b; }
      .admision-table-wrap { width:100%; overflow:auto; border:1px solid #cbd5e1; }
      .admision-table { width:100%; min-width:900px; border-collapse:collapse; color:#12233f; font-size:.86rem; }
      .admision-table th, .admision-table td { padding:13px 11px; border:1px solid #d6e1eb; text-align:left; vertical-align:top; }
      .admision-table th { background:#eaf8ef; color:#12233f; font-size:.75rem; text-transform:uppercase; }
      .admision-table th:first-child, .admision-table td:first-child { width:58px; text-align:center; }
      .admision-table tbody tr:nth-child(even) { background:#f8fbfc; }
      .admision-table input { width:100%; min-width:130px; padding:8px; border:1px solid #cbd5e1; border-radius:5px; color:#12233f; font:inherit; box-sizing:border-box; }
      .admision-table input:focus { outline:2px solid #168044; outline-offset:-1px; }
      .admision-entry-row td { background:#f8fbfc; }
      .admision-save { padding:8px 10px; border:0; border-radius:5px; background:#0d8f36; color:#fff; cursor:pointer; font:inherit; font-size:.78rem; font-weight:700; }
      .admision-empty { color:#65748b; }
      .admision-message { min-height:20px; margin:0 0 14px; color:#0d8f36; font-size:.82rem; font-weight:700; }
      .admision-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
      .admision-back, .admision-logout { display:inline-block; padding:11px 16px; border:0; border-radius:7px; background:#0d8f36; color:#fff; cursor:pointer; font:inherit; font-weight:700; text-decoration:none; }
      .admision-logout { background:#64748b; }
      .admision-inscripciones-title { margin:30px 0 12px; color:#12233f; font-size:1.15rem; }
      .admision-message-box { display:grid; gap:7px; min-width:220px; }
      .admision-message-box textarea { min-width:220px; min-height:62px; padding:7px; border:1px solid #cbd5e1; border-radius:5px; resize:vertical; font:inherit; font-size:.78rem; }
      .admision-message-save { width:fit-content; padding:7px 9px; border:0; border-radius:5px; background:#1769d1; color:#fff; cursor:pointer; font:inherit; font-size:.75rem; font-weight:700; }
      .admision-photo { display:block; width:110px; height:140px; object-fit:cover; border:1px solid #cbd5e1; border-radius:5px; cursor:pointer; }
      .admision-no-photo { color:#65748b; font-size:.72rem; }
      .admision-delete { width:30px; height:30px; border:0; border-radius:50%; background:#dc2626; color:#fff; cursor:pointer; font-size:1rem; font-weight:800; line-height:1; }
      .admision-delete:hover { background:#a71919; }
      @media (max-width:700px) { .admision-page { padding:22px 14px 35px; } .admision-card { padding:16px; } }
    </style>
  </head>
  <body>
    <main class="admision-page">
      <section class="admision-card">
        <h1>Admisión</h1>
        <p>Registro de postulantes de MateCiencias.</p>
        <h2 class="admision-inscripciones-title">Inscripciones a ciclos y pagos</h2>
        <div class="admision-table-wrap">
          <table class="admision-table">
            <thead><tr><th>N°</th><th>Foto</th><th>Código</th><th>Postulante</th><th>DNI</th><th>Ciclo</th><th>Modalidad</th><th>Medio de pago</th><th>N° de operación</th><th>Fecha de pago</th><th>Monto</th><th>Estado</th><th>Mensaje al estudiante</th><th>Acción</th></tr></thead>
            <tbody id="inscripcionesContent"></tbody>
          </table>
        </div>
        <div class="admision-actions">
          <a class="admision-back" href="dashboard.html">Volver al panel</a>
          <button class="admision-logout" id="admisionLogout" type="button">Cerrar sesión</button>
        </div>
      </section>
    </main>
    <script src="tarjetas/admision/usuario-admision.js"></script>
    <script src="usuarios-config.js?v=20260908-1"></script><script src="usuarios-api.js?v=20260908-1"></script><script src="usuario.js?v=20260908-7"></script>
    <script src="tarjetas/administracion/registro-integrado.js?v=20260908-1"></script>
    <script>
      const admisionSessionUser = sessionStorage.getItem('admisionUsuario') || '';
      const admisionAccess = window.registroAdminIntegrado || UsuarioService.userIsInList(admisionSessionUser, window.admisionAutorizados || []);
      if (!admisionAccess) {
        sessionStorage.removeItem('admisionUsuario');
        window.location.replace('tarjetas/admision/admision-login.html');
      }
      const inscripcionesContent = document.getElementById('inscripcionesContent');
      const escapeAdmision = (value) => String(value || '').replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);
      const renderInscripciones = () => {
        let records = [];
        try { records = JSON.parse(localStorage.getItem('matecienciasInscripciones') || '[]'); } catch (error) { records = []; }
        if (!Array.isArray(records)) records = [];
        inscripcionesContent.innerHTML = records.length ? records.map((record, index) => `<tr><td>${index + 1}</td><td>${record.foto ? `<img class="admision-photo" src="${escapeAdmision(record.foto)}" alt="Foto de ${escapeAdmision(record.nombreCompleto || record.nombre)}">` : '<span class="admision-no-photo">Sin foto</span>'}</td><td>${escapeAdmision(record.codigo)}</td><td>${escapeAdmision(record.nombreCompleto || record.nombre)}</td><td>${escapeAdmision(record.dni)}</td><td>${escapeAdmision(record.ciclo)}</td><td>${escapeAdmision(record.modalidad)}</td><td>${escapeAdmision(record.metodoPago)}</td><td>${escapeAdmision(record.operacion)}</td><td>${escapeAdmision(record.fechaPago)}</td><td>S/ ${escapeAdmision(record.monto)}</td><td>${escapeAdmision(record.estadoPago)}</td><td><div class="admision-message-box"><textarea data-message-index="${index}" placeholder="Escribe un mensaje">${escapeAdmision(record.mensajeEstudiante)}</textarea><button class="admision-message-save" type="button" data-save-message="${index}">Enviar mensaje</button></div></td><td><button class="admision-delete" type="button" data-delete-inscripcion="${index}" aria-label="Eliminar inscripción" title="Eliminar inscripción">X</button></td></tr>`).join('') : '<tr><td colspan="14" class="admision-empty">Todavía no hay inscripciones registradas.</td></tr>';
      };
      document.addEventListener('click', (event) => {
        const deleteButton = event.target.closest('[data-delete-inscripcion]');
        if (deleteButton) {
          if (!window.confirm('¿Deseas eliminar esta inscripción?')) return;
          let records = [];
          try { records = JSON.parse(localStorage.getItem('matecienciasInscripciones') || '[]'); } catch (error) { records = []; }
          const index = Number(deleteButton.dataset.deleteInscripcion);
          if (!Array.isArray(records) || !records[index]) return;
          records.splice(index, 1);
          localStorage.setItem('matecienciasInscripciones', JSON.stringify(records));
          renderInscripciones();
          return;
        }
        const button = event.target.closest('[data-save-message]');
        if (!button) return;
        let records = [];
        try { records = JSON.parse(localStorage.getItem('matecienciasInscripciones') || '[]'); } catch (error) { records = []; }
        const index = Number(button.dataset.saveMessage);
        const textarea = document.querySelector(`[data-message-index="${index}"]`);
        if (!Array.isArray(records) || !records[index] || !textarea) return;
        records[index].mensajeEstudiante = textarea.value.trim();
        localStorage.setItem('matecienciasInscripciones', JSON.stringify(records));
        button.textContent = 'Enviado';
        window.setTimeout(() => { button.textContent = 'Enviar mensaje'; }, 1200);
      });
      document.getElementById('admisionLogout').addEventListener('click', () => { sessionStorage.removeItem('admisionUsuario'); window.location.assign('tarjetas/admision/admision-login.html'); });
      renderInscripciones();
      window.addEventListener('storage', (event) => { if (event.key === 'matecienciasInscripciones') renderInscripciones(); });
    </script>
  </body>
</html>
