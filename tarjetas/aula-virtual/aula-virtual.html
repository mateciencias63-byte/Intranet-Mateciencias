    <script>
      const aulaLoginPage = document.getElementById('aulaLoginPage');
      const aulaContent = document.getElementById('aulaContent');
      const aulaLoginForm = document.getElementById('aulaLoginForm');
      const aulaLoginError = document.getElementById('aulaLoginError');
      aulaLoginForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const username = document.getElementById('aulaUser').value.trim();
        const normalizedUsername = username.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/\s+/g, ' ');
        const valid = UsuarioService.getApprovedAccounts().some((account) => {
          const normalizedAccount = account.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/\s+/g, ' ');
          return normalizedAccount === normalizedUsername;
        });
        if (!valid) { aulaLoginError.style.display = 'block'; return; }
        sessionStorage.setItem('aulaVirtualAuth', 'true');
        sessionStorage.setItem('dashboardUser', username);
        const next = new URLSearchParams(window.location.search).get('next');
        window.location.assign(next === 'calendario' ? 'tarjetas/aula-virtual/aula-virtual-contenido.html?view=calendario' : 'tarjetas/aula-virtual/aula-virtual-contenido.html');
      });
      async function renderAulaCatalog() {
        const catalog = document.getElementById('studentUniversityCatalog');
        const localCatalog = JSON.parse(localStorage.getItem('matecienciasAulaCatalogo') || '[]');
        let baseCatalog = [];
        try { baseCatalog = await (await fetch('aula-catalogo.json', { cache: 'no-store' })).json(); } catch (error) { baseCatalog = []; }
        const entries = [...baseCatalog, ...localCatalog].filter((item) => item.activo);
        catalog.innerHTML = entries.map((item) => `<a class="logo-card logo-card-link" href="${item.url}" aria-label="Abrir ${item.nombre}"><img src="${item.imagen || 'IDEPUNP.png'}" alt="${item.nombre}" /><div class="logo-label">${item.nombre}</div></a>`).join('');
      }
    </script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const aulaNameEl = document.getElementById('aulaName');
        const aulaAvatar = document.getElementById('aulaAvatar');
        const catalog = document.getElementById('studentUniversityCatalog');
        if (catalog && sessionStorage.getItem('aulaVirtualAuth') !== 'true') return;

        // Obtener el nombre del usuario desde UsuarioService
        const storedName = UsuarioService.getStoredUserName() || 'Estudiante';
        const initials = UsuarioService.getInitials(storedName);

        if (aulaNameEl) aulaNameEl.textContent = storedName;
        
        if (aulaAvatar) {
          // Crear SVG avatar con iniciales
          const colors = ['#1e7a42', '#0d8f36', '#16a34a', '#22c55e', '#059669', '#0891b2'];
          let hash = 0;
          for (let i = 0; i < storedName.length; i++) {
            hash = storedName.charCodeAt(i) + ((hash << 5) - hash);
          }
          const bgColor = colors[Math.abs(hash % colors.length)];
          
          const svg = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="50" fill="${bgColor}"/>
            <text x="50" y="50" font-size="40" font-weight="bold" fill="white" text-anchor="middle" dy=".3em">${initials}</text>
          </svg>`;
          
          aulaAvatar.innerHTML = svg;
        }
      });
