<!doctype html>
<html lang="es">
<head>
  <base href="../../" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendario | MateCiencias</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="tarjetas/calendario/calendario-aula.css?v=20260905-9" />
  <link rel="icon" href="logo.png" />
  <style>
    body { margin:0; min-height:100vh; background:#f5f8fb; color:#102a43; font-family:Arial,sans-serif; }
    .calendar-page-header { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:20px; background:white; }
    .calendar-page-header h1 { margin:0; }
    .calendar-page-main { padding:24px; }
    .calendar-card { padding:20px; border:1px solid #dbe7ed; border-radius:12px; background:white; }
    @media(max-width:600px) { .calendar-page-header { flex-direction:column; align-items:start; } .calendar-page-main { padding:12px; } .calendar-card { padding:12px; } }
  </style>
</head>
<body>
  <header class="calendar-page-header"><h1>Calendario</h1></header>
  <main class="calendar-page-main"><section class="calendar-card" aria-label="Agenda académica">
    <div class="aula-calendar-toolbar"><button type="button" id="aulaCalendarPrevious" aria-label="Mes anterior">←</button><strong id="aulaCalendarMonth"></strong><button type="button" id="aulaCalendarNext" aria-label="Mes siguiente">→</button></div>
    <div class="aula-calendar-grid" id="aulaCalendarGrid"></div>
  </section></main>
  <script src="tarjetas/calendario/calendario-aula.js?v=20260905-9"></script>
</body>
</html>
