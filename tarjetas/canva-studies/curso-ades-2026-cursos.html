<!DOCTYPE html>
<html lang="es">
  <head>
    <base href="../../" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formularios por curso | IDEPUNP ADES 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="logo.png" />
  </head>
  <body>
    <div class="formularios-page">
      <section class="formularios-panel">
        <div class="user-profile-bar" id="userProfile"></div>
        <div class="welcome-banner" style="margin-top: -54px;">
          <strong>FORMULARIOS POR CURSO</strong>
          <div class="welcome-tagline">IDEPUNP SETIEMBRE A DICIEMBRE · ADES 2026</div>
        </div>

        <div class="formularios-cards">
          <article class="formulario-card"><div class="formulario-avatar"><img src="canvas%20studies.png" alt="Razonamiento Matemático" /></div><div class="formulario-body"><strong>Razonamiento Matemático</strong></div></article>
          <article class="formulario-card"><div class="formulario-avatar"><img src="canvas%20studies.png" alt="Razonamiento Lógico" /></div><div class="formulario-body"><strong>Razonamiento Lógico</strong></div></article>
          <article class="formulario-card"><div class="formulario-avatar"><img src="canvas%20studies.png" alt="Aptitud Verbal" /></div><div class="formulario-body"><strong>Aptitud Verbal</strong></div></article>
          <article class="formulario-card"><div class="formulario-avatar"><img src="canvas%20studies.png" alt="Matemática 1" /></div><div class="formulario-body"><strong>Matemática 1</strong></div></article>
          <article class="formulario-card"><div class="formulario-avatar"><img src="canvas%20studies.png" alt="Física" /></div><div class="formulario-body"><strong>Física</strong></div></article>
          <article class="formulario-card"><div class="formulario-avatar"><img src="canvas%20studies.png" alt="Química" /></div><div class="formulario-body"><strong>Química</strong></div></article>
          <article class="formulario-card"><div class="formulario-avatar"><img src="canvas%20studies.png" alt="Biología" /></div><div class="formulario-body"><strong>Biología</strong></div></article>
          <article class="formulario-card"><div class="formulario-avatar"><img src="canvas%20studies.png" alt="Lenguaje" /></div><div class="formulario-body"><strong>Lenguaje</strong></div></article>
          <article class="formulario-card"><div class="formulario-avatar"><img src="canvas%20studies.png" alt="Literatura" /></div><div class="formulario-body"><strong>Literatura</strong></div></article>
          <article class="formulario-card"><div class="formulario-avatar"><img src="canvas%20studies.png" alt="Matemática 2" /></div><div class="formulario-body"><strong>Matemática 2</strong></div></article>
          <article class="formulario-card"><div class="formulario-avatar"><img src="canvas%20studies.png" alt="Historia del Perú" /></div><div class="formulario-body"><strong>Historia del Perú</strong></div></article>
          <article class="formulario-card"><div class="formulario-avatar"><img src="canvas%20studies.png" alt="Economía" /></div><div class="formulario-body"><strong>Economía</strong></div></article>
          <article class="formulario-card"><div class="formulario-avatar"><img src="canvas%20studies.png" alt="Geografía" /></div><div class="formulario-body"><strong>Geografía</strong></div></article>
        </div>

        <div class="formulario-footer">
          <a href="tarjetas/canva-studies/curso-ades-2026.html" class="btn-link">Volver</a>
        </div>
      </section>
    </div>
    <script src="usuarios-config.js?v=20260908-1"></script><script src="usuarios-api.js?v=20260908-1"></script><script src="usuario.js?v=20260908-7"></script>
    <script src="perfil-ranking.js"></script>
    <script>
      PerfilRankingService.renderProfile(document.getElementById('userProfile'));
      document.querySelectorAll('.formularios-cards .formulario-card').forEach((card) => {
        const course = card.querySelector('.formulario-body strong')?.textContent.trim();
        card.style.cursor = 'pointer';
        card.onclick = () => location.assign(`tarjetas/canva-studies/evaluacion-personalizada.html?ciclo=${encodeURIComponent('ADES 2026')}&curso=${encodeURIComponent(course)}`);
      });
    </script>
  </body>
</html>
