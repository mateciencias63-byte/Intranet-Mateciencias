<!DOCTYPE html>
<html lang="es">
  <head>
    <base href="../../" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IDEPUNP Regular 2026 - Semana</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="logo.png" />
  </head>
  <body>
    <div class="formularios-page">
      <section class="formularios-panel">
        <div class="user-profile-bar" id="userProfile"></div>
        <div class="welcome-banner" style="margin-top: -44px;">
          <strong id="weekTitle">SEMANA 1</strong>
          <div class="welcome-tagline">FORMULARIOS · REGULAR 2026</div>
        </div>
        <div class="formularios-cards" id="courseGrid"></div>
        <div class="formulario-footer"><a href="tarjetas/canva-studies/formularios-regular-2026-semanas.html" class="btn-link">Volver a las semanas</a></div>
      </section>
    </div>
    <script src="usuario.js?v=20260905-4"></script>
    <script src="perfil-ranking.js"></script>
    <script>
      PerfilRankingService.renderProfile(document.getElementById('userProfile'));
      const week = Math.max(1, parseInt(new URLSearchParams(location.search).get('week'), 10) || 1);
      const courses = ['Razonamiento Matemático', 'Razonamiento Lógico', 'Aptitud Verbal', 'Álgebra', 'Aritmética', 'Geometría', 'Trigonometría', 'Física', 'Química', 'Biología', 'Lenguaje', 'Literatura', 'Psicología', 'Educación Cívica', 'Filosofía', 'Historia del Perú', 'Historia Universal', 'Economía', 'Geografía'];
      document.getElementById('weekTitle').textContent = `SEMANA ${week}`;
      const courseGrid = document.getElementById('courseGrid');
      courses.forEach((course) => {
        const card = document.createElement('article');
        card.className = 'formulario-card';
        card.style.cursor = 'pointer';
        card.onclick = () => window.location.assign(`tarjetas/canva-studies/evaluacion-personalizada.html?ciclo=${encodeURIComponent('REGULAR 2026')}&semana=${week}&curso=${encodeURIComponent(course)}`);
        card.innerHTML = `<div class="formulario-avatar"><img src="canvas%20studies.png" alt="${course}" /></div><div class="formulario-body"><strong>${course}</strong></div>`;
        courseGrid.appendChild(card);
      });
    </script>
  </body>
</html>
