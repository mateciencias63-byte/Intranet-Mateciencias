<!DOCTYPE html>
<html lang="es">
  <head>
    <base href="../../" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MateCiencias | Matrícula</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="logo.png" />
    <style>
      .matricula-page { min-height:100vh; padding:32px clamp(18px,4vw,58px) 48px; }
      .matricula-card { width:100%; padding:24px; border:1px solid #e1e8f0; border-radius:10px; background:#fff; box-shadow:0 12px 28px rgba(15,41,80,.08); }
      .matricula-card h1 { margin:0; color:#12233f; font-size:clamp(1.7rem,3vw,2.35rem); }
      .matricula-card p { margin:8px 0 22px; color:#65748b; }
      .matricula-table-wrap { width:100%; overflow:auto; border:1px solid #cbd5e1; }
      .matricula-table { width:100%; min-width:760px; border-collapse:collapse; color:#12233f; font-size:.88rem; }
      .matricula-table th, .matricula-table td { padding:13px 11px; border:1px solid #d6e1eb; text-align:left; }
      .matricula-table th { background:#eaf8ef; color:#12233f; font-size:.75rem; text-transform:uppercase; }
      .matricula-table th:first-child, .matricula-table td:first-child { width:58px; text-align:center; }
      .matricula-table tbody tr:nth-child(even) { background:#f8fbfc; }
      .matricula-empty { color:#65748b; }
      .matricula-back { display:inline-block; margin-top:18px; padding:11px 16px; border-radius:7px; background:#0d8f36; color:#fff; font-weight:700; text-decoration:none; }
      @media (max-width:700px) { .matricula-page { padding:22px 14px 35px; } .matricula-card { padding:16px; } }
    </style>
  </head>
  <body>
    <main class="matricula-page"><section class="matricula-card"><h1>Matrícula</h1><p>Registro de estudiantes basado en las asistencias del Aula Virtual. Cada estudiante aparece una sola vez.</p><div id="matriculaContent"></div><a class="matricula-back" href="dashboard.html">Volver al panel</a></section></main>
    <script src="usuario.js?v=20260905-4"></script>
    <script src="tarjetas/administracion/registro-integrado.js?v=20260908-1"></script>
    <script>
      const matriculaAdminAccess = window.registroAdminIntegrado === true;
      if (!matriculaAdminAccess && !sessionStorage.getItem('matriculaUsuario')) window.location.replace('tarjetas/matricula/matricula-login.html');
      if (matriculaAdminAccess) document.querySelector('.matricula-back').href = 'tarjetas/administracion/admin-panel.html';
      const matriculaContent = document.getElementById('matriculaContent');
      const escapeMatricula = (value) => String(value || '').replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);
      const renderMatricula = () => {
        let records = [];
        try { records = JSON.parse(localStorage.getItem('matecienciasAsistencias') || '[]'); } catch (error) { records = []; }
        if (!Array.isArray(records)) records = [];
        const students = [...new Map(records.filter((record) => record.student).map((record) => [record.code || record.student, record])).values()];
        matriculaContent.innerHTML = students.length ? `<div class="matricula-table-wrap"><table class="matricula-table"><thead><tr><th>N°</th><th>Nombre y apellidos</th><th>Universidad</th><th>Carrera</th><th>Ciclo</th></tr></thead><tbody>${students.map((student, index) => `<tr><td>${index + 1}</td><td>${escapeMatricula(student.student)}</td><td>${escapeMatricula(student.university || 'Pendiente')}</td><td>${escapeMatricula(student.career || 'Pendiente')}</td><td>${escapeMatricula(student.className || 'Pendiente')}</td></tr>`).join('')}</tbody></table></div>` : '<p class="matricula-empty">Todavía no hay estudiantes registrados en las asistencias del Aula Virtual.</p>';
      };
      renderMatricula();
      window.addEventListener('storage', (event) => { if (event.key === 'matecienciasAsistencias') renderMatricula(); });
    </script>
  </body>
</html>
