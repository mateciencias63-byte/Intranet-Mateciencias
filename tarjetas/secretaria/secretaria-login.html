<!DOCTYPE html>
<html lang="es">
<head>
    <style>body { display:none !important; }</style>
    <script>window.location.replace(new URL("../../dashboard.html", window.location.href).href);</script>
    <base href="../../" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MateCiencias | Secretaría Académica</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="logo.png" />
  <style>
    body{min-height:100vh;margin:0;font-family:Roboto,Arial,sans-serif;background:linear-gradient(135deg,#e8f5ee,#eef5fb);color:#17324d}.secretaria-login-page{display:grid;min-height:100vh;place-items:center;padding:20px}.secretaria-login-box{width:min(400px,100%);box-sizing:border-box;padding:38px;border-radius:18px;background:#fff;box-shadow:0 20px 55px rgba(15,47,74,.17)}.secretaria-login-logo{display:block;width:92px;height:92px;margin:0 auto 20px;object-fit:contain}.secretaria-login-box h1{margin:0;color:#0b7f3a;text-align:center;font-size:1.55rem}.secretaria-login-box>p{margin:8px 0 26px;color:#64748b;text-align:center}.secretaria-login-form{display:grid;gap:14px}.secretaria-login-form label{display:grid;gap:7px;font-size:.86rem;font-weight:700}.secretaria-login-form input{padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.secretaria-login-form input:focus{outline:3px solid rgba(13,143,54,.13);border-color:#0d8f36}.secretaria-login-button{padding:12px;border:0;border-radius:9px;background:#0d8f36;color:#fff;font:inherit;font-weight:800;cursor:pointer}.secretaria-login-error{margin:0!important;padding:10px;border-radius:8px;background:#fee2e2;color:#b42318!important;text-align:left!important;font-size:.82rem}.hidden{display:none}.secretaria-login-back{color:#0d8f36;text-align:center;text-decoration:none;font-size:.86rem}
  </style>
</head>
<body>
  <main class="secretaria-login-page">
    <section class="secretaria-login-box">
      <img class="secretaria-login-logo" src="logo.png" alt="Logo de MateCiencias" />
      <h1>Secretaría Académica</h1>
      <p>Acceso exclusivo para personal autorizado</p>
      <form class="secretaria-login-form" id="secretariaLoginForm">
        <label>Usuario<input id="secretariaUserInput" autocomplete="username" required placeholder="Ingrese su usuario" /></label>
        <p class="secretaria-login-error hidden" id="secretariaLoginError">Este usuario no está autorizado.</p>
        <button class="secretaria-login-button" type="submit">Ingresar</button>
        <a class="secretaria-login-back" href="dashboard.html">← Volver al panel principal</a>
      </form>
    </section>
  </main>
  <script src="tarjetas/secretaria/usuario-secretaria.js"></script>
  <script src="usuarios-config.js?v=20260908-1"></script><script src="usuarios-api.js?v=20260908-1"></script><script src="usuario.js?v=20260908-7"></script>
  <script>
    document.getElementById('secretariaLoginForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const username = document.getElementById('secretariaUserInput').value.trim();
      const allowed = UsuarioService.userIsInList(username, window.secretariaAutorizados || []);
      document.getElementById('secretariaLoginError').classList.toggle('hidden', allowed);
      if (!allowed) return;
      sessionStorage.setItem('secretariaUsuario', username);
      const next = new URLSearchParams(window.location.search).get('next');
      window.location.assign(next === 'tramites' ? 'tarjetas/secretaria/secretaria-academica.html?module=tramites' : 'tarjetas/secretaria/secretaria-academica.html');
    });
  </script>
</body>
</html>
