<!DOCTYPE html>
<html lang="es">
  <head>
    <style>body { display:none !important; }</style>
    <script>window.location.replace(new URL("../../dashboard.html", window.location.href).href);</script>
    <base href="../../" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MateCiencias | Contabilidad</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="logo.png" />
  </head>
  <body>
    <style>
      .service-login-page { display:flex; justify-content:center; align-items:center; width:100%; min-height:100vh; padding:20px; box-sizing:border-box; }
      .service-login-box { width:100%; max-width:400px; padding:40px; border-radius:12px; background:#fff; box-shadow:0 10px 40px rgba(0,0,0,.2); box-sizing:border-box; }
      .service-login-logo { display:flex; justify-content:center; margin-bottom:30px; }
      .service-login-logo img { width:120px; height:120px; object-fit:contain; }
      .service-login-title { margin-bottom:10px; color:#0d8f36; font-size:24px; font-weight:700; text-align:center; }
      .service-login-subtitle { margin-bottom:30px; color:#666; font-size:14px; text-align:center; }
      .service-login-form { display:grid; gap:14px; }
      .service-login-form label { display:grid; gap:8px; color:#333; font-size:14px; font-weight:600; }
      .service-login-form input { width:100%; padding:12px; border:2px solid #ddd; border-radius:8px; font:inherit; box-sizing:border-box; }
      .service-login-form input:focus { outline:none; border-color:#0d8f36; }
      .service-login-button { padding:12px; border:0; border-radius:8px; background:#0d8f36; color:#fff; cursor:pointer; font-size:16px; font-weight:700; }
      .service-login-error { margin:0; padding:12px; border-radius:8px; background:#fee; color:#c33; font-size:14px; }
      .service-login-error.hidden { display:none; }
      .service-login-back { margin-top:20px; color:#0d8f36; font-size:14px; text-align:center; text-decoration:none; }
    </style>
    <div class="service-login-page"><main class="service-login-box"><div class="service-login-logo"><img src="logo.png" alt="MateCiencias Logo" /></div><div class="service-login-title">Contabilidad</div><div class="service-login-subtitle">Acceso exclusivo para administración y secretaría</div><form class="service-login-form" id="accountingLoginForm"><label for="accountingUserInput">Usuario:<input id="accountingUserInput" type="text" placeholder="Ingrese su usuario" required /></label><p class="service-login-error hidden" id="accountingLoginError">Este usuario no tiene permiso para acceder a Contabilidad.</p><button type="submit" class="service-login-button">Acceder</button><a href="dashboard.html" class="service-login-back">&larr; Volver al panel principal</a></form></main></div>
    <script src="tarjetas/tesoreria/usuario-tesorera.js"></script>
    <script src="usuario.js?v=20260905-4"></script>
    <script>
      document.getElementById('accountingLoginForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const username = document.getElementById('accountingUserInput').value.trim();
        const allowed = UsuarioService.userIsInList(username, window.tesoreraAutorizados || []);
        const error = document.getElementById('accountingLoginError');
        if (!allowed) { error.classList.remove('hidden'); return; }
        error.classList.add('hidden');
        sessionStorage.setItem('contabilidadUsuario', username);
        window.location.assign('tarjetas/tesoreria/contabilidad.html');
      });
    </script>
  </body>
</html>
